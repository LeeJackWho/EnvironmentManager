<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>增强验证码功能测试</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            margin-left: 10px;
        }
        .status-enhanced {
            background: #28a745;
            color: white;
        }
        .status-mock {
            background: #ffc107;
            color: #333;
        }
        .status-traditional {
            background: #6c757d;
            color: white;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #667eea;
            outline: none;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-right: 10px;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 500px;
            overflow-y: auto;
            border: 2px solid #ddd;
        }
        .success {
            background: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
        .info {
            background: #d1ecf1;
            border-color: #bee5eb;
            color: #0c5460;
        }
        .warning {
            background: #fff3cd;
            border-color: #ffeaa7;
            color: #856404;
        }
        .feature-highlight {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .feature-highlight h3 {
            margin-top: 0;
            font-size: 1.3em;
        }
        .feature-list {
            list-style: none;
            padding: 0;
        }
        .feature-list li {
            padding: 5px 0;
            padding-left: 25px;
            position: relative;
        }
        .feature-list li:before {
            content: "✨";
            position: absolute;
            left: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 增强验证码功能测试 <span class="status-badge status-enhanced">ENHANCED</span></h1>
        
        <div class="feature-highlight">
            <h3>🚀 新功能特性</h3>
            <ul class="feature-list">
                <li>智能 API 回退机制：API 不可用时自动使用增强模拟模式</li>
                <li>增强模拟分析：更智能的验证码类型识别和置信度计算</li>
                <li>优化操作策略：针对不同验证码类型的专门处理逻辑</li>
                <li>详细调试信息：完整的执行步骤记录和错误诊断</li>
                <li>多层回退保护：确保在任何情况下都能提供有用的结果</li>
            </ul>
        </div>
        
        <form id="testForm">
            <div class="form-group">
                <label for="name">网站名称:</label>
                <input type="text" id="name" value="增强测试网站" required>
            </div>
            
            <div class="form-group">
                <label for="url">登录页面 URL:</label>
                <input type="url" id="url" value="https://example.com/enhanced-login" required>
            </div>
            
            <div class="form-group">
                <label for="username">用户名:</label>
                <input type="text" id="username" value="enhanced_user" required>
            </div>
            
            <div class="form-group">
                <label for="password">密码:</label>
                <input type="password" id="password" value="enhanced_pass" required>
            </div>
            
            <div class="form-group">
                <label for="captchaType">验证码类型:</label>
                <select id="captchaType">
                    <option value="无">无验证码</option>
                    <option value="图形" selected>图形验证码</option>
                    <option value="滑动">滑动验证码</option>
                    <option value="点击">点击验证码</option>
                    <option value="短信">短信验证码</option>
                </select>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="useMidscene" checked>
                <label for="useMidscene">🧠 启用 Midscene.js 增强智能模式</label>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="enableDebug" checked>
                <label for="enableDebug">🔍 启用详细调试日志</label>
            </div>
            
            <div class="form-group">
                <label for="notes">测试备注:</label>
                <textarea id="notes" rows="3" placeholder="增强功能测试...">测试增强验证码功能：智能回退机制、增强模拟分析、优化操作策略</textarea>
            </div>
            
            <button type="submit" id="testBtn">🚀 开始增强测试</button>
            <button type="button" id="clearBtn">🗑️ 清空结果</button>
        </form>
        
        <div id="result" class="result info" style="display: none;"></div>
    </div>

    <script>
        const form = document.getElementById('testForm');
        const testBtn = document.getElementById('testBtn');
        const clearBtn = document.getElementById('clearBtn');
        const result = document.getElementById('result');

        // 测试增强自动登录
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            testBtn.disabled = true;
            testBtn.textContent = '🔄 增强测试中...';
            
            showResult('🧠 开始增强验证码功能测试...\n\n🔍 测试特性:\n- 智能 API 回退机制\n- 增强模拟分析\n- 优化操作策略\n- 详细调试信息\n\n', 'info');
            
            const formData = {
                name: document.getElementById('name').value,
                url: document.getElementById('url').value,
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                captchaType: document.getElementById('captchaType').value,
                useMidscene: document.getElementById('useMidscene').checked,
                notes: document.getElementById('notes').value,
                enhanced: true, // 标记为增强测试
                debug: document.getElementById('enableDebug').checked
            };
            
            try {
                const startTime = Date.now();
                
                const response = await fetch('/api/enhanced-auto-login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                const endTime = Date.now();
                const duration = endTime - startTime;
                
                const data = await response.json();
                
                // 分析结果类型
                let resultType = 'info';
                let statusBadge = '';
                
                if (data.success) {
                    resultType = 'success';
                    statusBadge = '✅ 增强测试成功';
                } else {
                    resultType = 'warning';
                    statusBadge = '⚠️ 部分功能完成';
                }
                
                // 检查是否使用了增强模式
                const resultText = JSON.stringify(data, null, 2);
                if (resultText.includes('enhanced_mock') || resultText.includes('增强')) {
                    statusBadge += ' (增强模式)';
                } else if (resultText.includes('模拟')) {
                    statusBadge += ' (模拟模式)';
                } else {
                    statusBadge += ' (传统模式)';
                }
                
                const resultMessage = `${statusBadge}
执行时间: ${duration}ms

📊 详细结果:
${JSON.stringify(data, null, 2)}

🔍 功能验证:
- Midscene 智能模式: ${formData.useMidscene ? '✅ 已启用' : '❌ 未启用'}
- 增强回退机制: ${resultText.includes('enhanced') ? '✅ 已激活' : '⚠️ 未激活'}
- 调试信息记录: ${data.data?.sessionDir ? '✅ 已保存' : '❌ 未保存'}
- 验证码处理: ${data.data?.loginResult?.captchaDetected ? '✅ 已检测' : 'ℹ️ 未检测到'}

💡 测试说明:
即使 API 不可用，增强模式仍能提供智能的验证码处理方案。
查看调试目录获取详细的执行步骤和截图记录。`;
                
                showResult(resultMessage, resultType);
                
            } catch (error) {
                showResult(`❌ 增强测试失败: ${error.message}

🔧 可能原因:
1. 服务器未启动 (npm run dev)
2. API 端点不可用
3. 网络连接问题

💡 解决建议:
1. 确保开发服务器正在运行
2. 检查控制台错误信息
3. 验证 API 路由配置`, 'error');
            } finally {
                testBtn.disabled = false;
                testBtn.textContent = '🚀 开始增强测试';
            }
        });

        // 清空结果
        clearBtn.addEventListener('click', () => {
            result.style.display = 'none';
            result.textContent = '';
        });

        function showResult(text, type) {
            result.textContent = text;
            result.className = `result ${type}`;
            result.style.display = 'block';
            result.scrollTop = result.scrollHeight;
        }

        // 页面加载时显示说明
        window.addEventListener('load', () => {
            showResult(`🧠 增强验证码功能测试工具已就绪

🚀 新功能特性:
✨ 智能 API 回退机制 - API 不可用时自动使用增强模拟
✨ 增强模拟分析 - 更智能的验证码识别和处理
✨ 优化操作策略 - 针对不同类型的专门处理逻辑
✨ 详细调试信息 - 完整的执行记录和错误诊断
✨ 多层回退保护 - 确保任何情况下都有可用结果

📋 测试流程:
1. 填写测试网站信息
2. 选择验证码类型
3. 确保启用 Midscene.js 增强模式
4. 点击"开始增强测试"
5. 观察是否显示"增强模式"或"智能模拟"

🎯 预期结果:
即使 Midscene API 不可用，系统也会：
- 显示"使用增强智能模拟验证码分析"
- 提供更高的置信度和更详细的操作建议
- 生成针对性的验证码处理策略
- 记录完整的调试信息

现在开始测试，验证增强功能是否正常工作！`, 'info');
        });
    </script>
</body>
</html>
